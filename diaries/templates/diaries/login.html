<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - MyDay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex items-center justify-center px-4">

    <div class="bg-white/20 backdrop-blur-lg border border-white/30 p-8 rounded-3xl shadow-2xl w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-1">Welcome Back!</h1>
            <p class="text-white/80 text-sm">Silakan masuk untuk menulis cerita.</p>
        </div>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <div>
                <input type="text" name="username" placeholder="Username" required 
                    class="w-full bg-white/50 border-none rounded-xl px-4 py-3 placeholder-gray-500 focus:ring-2 focus:ring-white focus:bg-white/80 transition outline-none">
            </div>

            <div>
                <input type="password" name="password" placeholder="Password" required 
                    class="w-full bg-white/50 border-none rounded-xl px-4 py-3 placeholder-gray-500 focus:ring-2 focus:ring-white focus:bg-white/80 transition outline-none">
            </div>

            <button type="submit" class="w-full bg-white text-indigo-600 font-bold py-3 rounded-xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition transform">
                Masuk Sekarang
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'index' %}" class="text-white/70 text-sm hover:text-white underline">Kembali ke Beranda</a>
        </div>
    </div>

</body>
</html>
