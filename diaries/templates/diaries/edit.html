<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Cerita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-[Nunito]">

    <div class="max-w-lg w-full bg-white rounded-3xl shadow-xl p-6 border border-slate-100">
        <h2 class="text-xl font-bold font-[Quicksand] text-gray-800 mb-4 flex items-center gap-2">
            <i class="ph-duotone ph-pencil-simple text-orange-500"></i> Edit Cerita
        </h2>
        
        <form method="POST">
            {% csrf_token %}
            <textarea name="content" rows="6" 
                class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none resize-none text-gray-700 leading-relaxed"
                required>{{ entry.content }}</textarea>
            
            <div class="flex justify-end gap-3 mt-6">
                <a href="{% url 'index' %}" class="px-5 py-2.5 rounded-xl text-gray-500 hover:bg-gray-100 font-bold text-sm transition">Batal</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition">
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>

</body>
</html>
